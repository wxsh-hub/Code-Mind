# 存量敏感数据修复工具配置
# 数据库、Redis 连接信息均从 application.yaml 读取，此处只配置修复范围与确认串
application.config=../../../bootstrap/src/main/resources/application.yaml

database.connect-timeout-seconds=5
database.statement-timeout-seconds=120
# 仅当 Classpath、本机 Maven 缓存和 bootstrap/target 都找不到驱动时才需要指定
# database.jdbc-driver-path=/absolute/path/to/postgresql.jar

# 留空 = 全量扫描；填入 kb_id 可只修某个知识库
repair.kb-id=

# 真实改写时需在命令行回显该串，防止误触
repair.confirmation=REPAIR-SENSITIVE-DATA
