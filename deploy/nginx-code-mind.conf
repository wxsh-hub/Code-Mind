# Code-Mind 站点入口配置
#
# 三个 server 块分工：
#   80  + 域名   → 301 跳 HTTPS
#   80  + 其他   → 明文直服（保留 IP 直连，便于排障）
#   443 + 域名   → HTTPS 主入口
#
# 公共的资源、压缩、缓存、API 反代配置在 nginx-code-mind-locations.inc

# ---- 80：域名访问一律跳 HTTPS ----
server {
    listen 80;
    server_name wxsh.cloud www.wxsh.cloud;

    return 301 https://$host$request_uri;
}

# ---- 80：IP 或未知 Host 直接访问 ----
# 不跳 HTTPS 是有意为之：证书只签了 wxsh.cloud 两个域名，
# 用 IP 走 HTTPS 会触发域名不匹配告警，排障时反而添乱。
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 100m;
    include /etc/nginx/conf.d/code-mind-locations.inc;
}

# ---- 443：HTTPS 主入口 ----
server {
    listen 443 ssl;
    # nginx 1.25.1 起 http2 改为独立指令，不再写在 listen 后面
    http2 on;
    server_name wxsh.cloud www.wxsh.cloud;

    client_max_body_size 100m;

    ssl_certificate     /opt/code-mind/ssl/fullchain.crt;
    ssl_certificate_key /opt/code-mind/ssl/private.key;

    # 只保留 TLS 1.2/1.3：1.0/1.1 已被主流浏览器判定为不安全
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 会话复用：减少重复握手的开销
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS：告知浏览器此后只走 HTTPS。
    # 未加 includeSubDomains —— 该域名下可能还有别的服务在跑明文，
    # 贸然全站强制会让它们不可访问
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/conf.d/code-mind-locations.inc;
}
