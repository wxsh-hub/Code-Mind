services:
  postgres:
    container_name: ragent-postgres
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragent
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: ragent-redis
    image: redis:7-alpine
    command: redis-server --requirepass 123456
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  namesrv:
    container_name: ragent-rocketmq-namesrv
    image: apache/rocketmq:5.2.0
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "ls /root/logs/rocketmqlogs/namesrv.log 2>/dev/null && cat /root/logs/rocketmqlogs/namesrv.log | tail -1 | grep -q 'boot success' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  broker:
    container_name: ragent-rocketmq-broker
    image: apache/rocketmq:5.2.0
    command: sh mqbroker -n namesrv:9876 -c /tmp/broker.properties
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx512m"
    volumes:
      - ./broker.properties:/tmp/broker.properties
    depends_on:
      namesrv:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "ls /root/logs/rocketmqlogs/broker.log 2>/dev/null && cat /root/logs/rocketmqlogs/broker.log | tail -1 | grep -q 'boot success' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  rustfs:
    container_name: ragent-rustfs
    image: rustfs/rustfs:1.0.0-alpha.72
    command:
      - "--address"
      - ":9000"
      - "--console-enable"
      - "--access-key"
      - "rustfsadmin"
      - "--secret-key"
      - "rustfsadmin"
      - "/data"
    environment:
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
      - RUSTFS_CONSOLE_ENABLE=true
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pg-data:
  redis-data:
  rustfs-data:
